site_name: MIDI-GPT for Live
site_description: A multitrack MIDI generation machine for Ableton Live
site_url: https://metacreation-lab.github.io/midigpt-LIVE/
repo_url: https://github.com/Metacreation-Lab/midigpt-LIVE
repo_name: Metacreation-Lab/midigpt-LIVE
copyright: Copyright &copy; 2026 Metacreation Lab for Creative AI, Simon Fraser University
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:                       # follows the system setting; the header toggle overrides it
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Get started:
    - Install: install.md
    - Quick start: quickstart.md
  - The device:
    - Choosing what to write: guide/roll.md
    - TRACK: guide/track.md
    - SAMPLE: guide/sample.md
    - OUTPUT and takes: guide/output.md
    - MASKS: guide/masks.md
    - ENGINE: guide/engine.md
    - SETUP: guide/setup.md
  - Workflows: workflows.md
  - Troubleshooting: troubleshooting.md
  - For developers: developers.md
  - About: about.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search

extra_css:
  - assets/styles/manual.css

exclude_docs: |
  images/
